name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test

jobs:
  test:
    name: Compile, format, credo, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: runeshare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir / OTP
        id: beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      # Restore and save are separate steps so the cache is saved even when a
      # later step fails (actions/cache only saves on success). The key includes
      # the OTP/Elixir versions so a version bump never restores a stale _build.
      - name: Restore deps and build cache
        id: mix-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-ex${{ steps.beam.outputs.elixir-version }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-ex${{ steps.beam.outputs.elixir-version }}-mix-

      - name: Install deps
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      # The formatter canonicalises Tailwind classes, which needs the Tailwind binary.
      - name: Install Tailwind and esbuild
        run: mix do tailwind.install --if-missing + esbuild.install --if-missing

      - name: Check formatting
        run: mix format --check-formatted

      - name: Check for unused deps
        run: mix deps.unlock --check-unused

      - name: Check skills are up to date
        run: MIX_ENV=dev mix do deps.get + usage_rules.sync --yes && git diff --exit-code .claude/skills/ash-framework .claude/skills/phoenix-framework

      - name: Credo
        run: mix credo --strict

      # Browser (Playwright) tests are local-only; run them with `mix test`.
      - name: Tests
        run: mix test --exclude playwright

      # Last, so it also holds the dev build from the skills check. Skipped when
      # the exact key was restored (keys are immutable); app code recompiles fast.
      - name: Save deps and build cache
        if: always() && steps.mix-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            deps
            _build
          key: ${{ steps.mix-cache.outputs.cache-primary-key }}
